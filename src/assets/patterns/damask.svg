<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Thailändische Vierblatt-Blüte (Pra Jam Yam) als Damast-Muster, wird als CSS-Maske genutzt -->
  <defs>
    <path id="petal" fill-rule="evenodd" d="M0-4.5C-5.2-8.4-6.8-14.6 0-22c6.8 7.4 5.2 13.6 0 17.5zM0-8.6c-2.4-2.2-2.7-5.2 0-8.6 2.7 3.4 2.4 6.4 0 8.6z"/>
    <path id="leaf" d="M0-5.2c-2.7-2-3.1-5-0-8.6 3.1 3.6 2.7 6.6 0 8.6z"/>
    <g id="flower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#leaf" transform="rotate(45)"/>
      <use href="#leaf" transform="rotate(135)"/>
      <use href="#leaf" transform="rotate(225)"/>
      <use href="#leaf" transform="rotate(315)"/>
      <path fill-rule="evenodd" d="M0-4.2a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 1 1 0-8.4zM0-2.1a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 1 0 0-4.2z"/>
    </g>
    <g id="bud">
      <circle r="1.6"/>
      <circle cx="0" cy="-4.2" r="1"/>
      <circle cx="4.2" cy="0" r="1"/>
      <circle cx="0" cy="4.2" r="1"/>
      <circle cx="-4.2" cy="0" r="1"/>
    </g>
  </defs>
  <use href="#flower" transform="translate(48 48)"/>
  <use href="#flower" transform="translate(0 0) scale(.62)"/>
  <use href="#flower" transform="translate(96 0) scale(.62)"/>
  <use href="#flower" transform="translate(0 96) scale(.62)"/>
  <use href="#flower" transform="translate(96 96) scale(.62)"/>
  <use href="#bud" transform="translate(48 0)"/>
  <use href="#bud" transform="translate(48 96)"/>
  <use href="#bud" transform="translate(0 48)"/>
  <use href="#bud" transform="translate(96 48)"/>
</svg>
